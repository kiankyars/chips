<text x="142" y="1012" fill="#74746f" font-size="17" font-weight="760" text-anchor="start" letter-spacing="1.8">MORE SUBSTITUTABLE</text>
<text x="1778" y="1012" fill="#74746f" font-size="17" font-weight="760" text-anchor="end" letter-spacing="1.8">MORE INTERDEPENDENT</text>
<text x="960" y="1050" fill="#74746f" font-size="16" font-weight="560" text-anchor="middle" letter-spacing="0">Qualitative synthesis · not a forecast in years</text>
