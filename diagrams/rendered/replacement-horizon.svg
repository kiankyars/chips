<path d="M730 630C980 584 1110 552 1300 492" fill="none" stroke="#7358a3" stroke-width="17" stroke-linecap="round"/>
<path d="M1300 492C1510 426 1640 354 1744 318" fill="none" stroke="#c3842e" stroke-width="17" stroke-linecap="round"/>
<path d="M1740 288L1800 304L1754 346Z" fill="#c3842e"/>

<text x="150" y="230" fill="#4f8064" font-size="22" font-weight="840" text-anchor="start" letter-spacing="2.1">REALLOCATE</text>
<text x="150" y="265" fill="#74746f" font-size="18" font-weight="620" text-anchor="start" letter-spacing="0">existing qualified volume</text>
<path d="M150 288H500" stroke="#4f8064" stroke-width="4" opacity="0.6"/>

<text x="740" y="230" fill="#7358a3" font-size="22" font-weight="840" text-anchor="start" letter-spacing="2.1">BUILD + QUALIFY</text>
<text x="740" y="265" fill="#74746f" font-size="18" font-weight="620" text-anchor="start" letter-spacing="0">process, yield, and manufacturing depth</text>
<path d="M740 288H1215" stroke="#7358a3" stroke-width="4" opacity="0.6"/>

<text x="1340" y="230" fill="#c3842e" font-size="22" font-weight="840" text-anchor="start" letter-spacing="2.1">RECREATE A STACK</text>
<text x="1340" y="265" fill="#74746f" font-size="18" font-weight="620" text-anchor="start" letter-spacing="0">tools, IP, suppliers, and know-how align</text>
<path d="M1340 288H1778" stroke="#c3842e" stroke-width="4" opacity="0.6"/>

