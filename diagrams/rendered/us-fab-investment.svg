<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title id="title">Export controls buy time while domestic semiconductor capacity builds resilience</title>
<desc id="desc">A single progression shows the projected United States share of global below ten nanometre logic capacity rising from zero percent in 2022 to twenty-eight percent in 2032, with incentives, construction, qualification, and yield ramp between them.</desc>
<defs>
  <pattern id="paper-grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#ddd5c8" stroke-width="1" opacity="0.22"/>
  </pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#493f30" flood-opacity="0.13"/>
  </filter>
  <marker id="arrow-ink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#4f5965"/>
  </marker>
  <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#3977a8"/>
  </marker>
  <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#397a66"/>
  </marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#ad4f5d"/>
  </marker>
</defs>
<rect width="1920" height="1080" fill="#f4efe6"/>
<rect width="1920" height="1080" fill="url(#paper-grid)"/>
<text x="84" y="72" fill="#777c79" font-size="21" font-weight="780" text-anchor="start" letter-spacing="2.2" opacity="1">US INDUSTRIAL POLICY</text>
<text x="84" y="136" fill="#1f272d" font-size="52" font-weight="820" text-anchor="start" letter-spacing="0" opacity="1">Export controls buy time; domestic capacity builds resilience</text>
<text x="84" y="181" fill="#777c79" font-size="23" font-weight="540" text-anchor="start" letter-spacing="0" opacity="1">The domestic half of semiconductor policy is a capacity build, not another restriction.</text>
<path d="M84 210L1836 210" fill="none" stroke="#ddd5c8" stroke-width="2"/>
<text x="960" y="350" fill="#7358a3" font-size="21" font-weight="780" text-anchor="middle" letter-spacing="2.2" opacity="1">PROJECTED U.S. SHARE OF GLOBAL &lt;10 nm LOGIC CAPACITY</text>

<text x="248" y="640" fill="#3977a8" font-size="156" font-weight="860" text-anchor="middle" letter-spacing="0" opacity="1">0%</text>
<text x="248" y="704" fill="#777c79" font-size="27" font-weight="800" text-anchor="middle" letter-spacing="1.5" opacity="1">2022</text>

<path d="M438 600L1448 600" fill="none" stroke="#4f5965" stroke-width="9" marker-end="url(#arrow-ink)"/>

<circle cx="650" cy="600" r="15" fill="#3977a8"/>
<text x="650" y="486" fill="#3977a8" font-size="21" font-weight="840" text-anchor="middle" letter-spacing="1.2" opacity="1">PUBLIC INCENTIVES</text>
<text x="650" y="528" fill="#777c79" font-size="21" font-weight="580" text-anchor="middle" letter-spacing="0" opacity="1">grants · loans · equity · 25% credit</text>

<circle cx="960" cy="600" r="15" fill="#7358a3"/>
<text x="960" y="486" fill="#7358a3" font-size="21" font-weight="840" text-anchor="middle" letter-spacing="1.2" opacity="1">CONSTRUCTION</text>
<text x="960" y="528" fill="#777c79" font-size="21" font-weight="580" text-anchor="middle" letter-spacing="0" opacity="1">build and equip the fabs</text>

<circle cx="1270" cy="600" r="15" fill="#397a66"/>
<text x="1270" y="486" fill="#397a66" font-size="21" font-weight="840" text-anchor="middle" letter-spacing="1.2" opacity="1">QUALIFICATION + YIELD</text>
<text x="1270" y="528" fill="#777c79" font-size="21" font-weight="580" text-anchor="middle" letter-spacing="0" opacity="1">turn capacity into usable output</text>

<text x="1665" y="640" fill="#397a66" font-size="156" font-weight="870" text-anchor="middle" letter-spacing="0" opacity="1">28%</text>
<text x="1665" y="704" fill="#777c79" font-size="27" font-weight="800" text-anchor="middle" letter-spacing="1.5" opacity="1">2032E</text>

<text x="960" y="1000" fill="#777c79" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="0.5" opacity="1">SIA / BCG · May 2024</text>
</svg>
