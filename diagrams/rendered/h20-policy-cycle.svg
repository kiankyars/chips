<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title id="title">Policy repeatedly opened and closed the market for Nvidia China chips</title>
<desc id="desc">An access-state line tracks the H20 from its October 2023 design through licensing, a partial reopening, halted production, and January 2026 case-by-case review for H200.</desc>
<defs>
  <pattern id="paper-grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#ddd5c8" stroke-width="1" opacity="0.22"/>
  </pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#493f30" flood-opacity="0.13"/>
  </filter>
  <marker id="arrow-ink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#4f5965"/>
  </marker>
  <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#3977a8"/>
  </marker>
  <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#397a66"/>
  </marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#ad4f5d"/>
  </marker>
</defs>
<rect width="1920" height="1080" fill="#f4efe6"/>
<rect width="1920" height="1080" fill="url(#paper-grid)"/>
<text x="84" y="72" fill="#777c79" font-size="21" font-weight="780" text-anchor="start" letter-spacing="2.2" opacity="1">ACCESS TO CHINA · OCT 2023–JAN 2026</text>
<text x="84" y="136" fill="#1f272d" font-size="52" font-weight="820" text-anchor="start" letter-spacing="0" opacity="1">Policy repeatedly opened and closed Nvidia's China market</text>
<text x="84" y="181" fill="#777c79" font-size="23" font-weight="540" text-anchor="start" letter-spacing="0" opacity="1">A compliance product did not create stable market access.</text>
<path d="M84 210L1836 210" fill="none" stroke="#ddd5c8" stroke-width="2"/>
<text x="150" y="352" fill="#397a66" font-size="17" font-weight="820" text-anchor="end" letter-spacing="1.5" opacity="1">OPEN</text>
<text x="150" y="560" fill="#bd7b25" font-size="17" font-weight="820" text-anchor="end" letter-spacing="1.5" opacity="1">LICENSED</text>
<text x="150" y="776" fill="#ad4f5d" font-size="17" font-weight="820" text-anchor="end" letter-spacing="1.5" opacity="1">BLOCKED</text>
<path d="M188 360L188 790" fill="none" stroke="#ddd5c8" stroke-width="4"/>
<path d="M230 400H405V600H755V460H1105V770H1455V570H1630" fill="none" stroke="#4f5965" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<g>
  <path d="M230 286L230 840" fill="none" stroke="#ddd5c8" stroke-width="2" stroke-dasharray="8 10"/>
  <text x="230" y="270" fill="#777c79" font-size="19" font-weight="820" text-anchor="middle" letter-spacing="1.2" opacity="1">OCT 2023</text>
  <circle cx="230" cy="400" r="17" fill="#fffaf0" stroke="#397a66" stroke-width="7"/>
  <text x="230" y="328" fill="#397a66" font-size="20" font-weight="820" text-anchor="middle" letter-spacing="0.6" opacity="1">H20 DESIGNED</text>
  <text x="230" y="358" fill="#777c79" font-size="17" font-weight="560" text-anchor="middle" letter-spacing="0" opacity="1">H800 route closes</text>
</g>
<g>
  <path d="M580 286L580 840" fill="none" stroke="#ddd5c8" stroke-width="2" stroke-dasharray="8 10"/>
  <text x="580" y="270" fill="#777c79" font-size="19" font-weight="820" text-anchor="middle" letter-spacing="1.2" opacity="1">APR 2025</text>
  <circle cx="580" cy="600" r="17" fill="#fffaf0" stroke="#ad4f5d" stroke-width="7"/>
  <text x="580" y="660" fill="#ad4f5d" font-size="20" font-weight="820" text-anchor="middle" letter-spacing="0.6" opacity="1">LICENSE REQUIRED</text>
  <text x="580" y="690" fill="#777c79" font-size="17" font-weight="560" text-anchor="middle" letter-spacing="0" opacity="1">$4.5B charge</text>
</g>
<g>
  <path d="M930 286L930 840" fill="none" stroke="#ddd5c8" stroke-width="2" stroke-dasharray="8 10"/>
  <text x="930" y="270" fill="#777c79" font-size="19" font-weight="820" text-anchor="middle" letter-spacing="1.2" opacity="1">JUL–AUG 2025</text>
  <circle cx="930" cy="460" r="17" fill="#fffaf0" stroke="#bd7b25" stroke-width="7"/>
  <text x="930" y="408" fill="#bd7b25" font-size="20" font-weight="820" text-anchor="middle" letter-spacing="0.6" opacity="1">PARTLY REOPENED</text>
  <text x="930" y="438" fill="#777c79" font-size="17" font-weight="560" text-anchor="middle" letter-spacing="0" opacity="1">reported 15% licensing deal</text>
</g>
<g>
  <path d="M1280 286L1280 840" fill="none" stroke="#ddd5c8" stroke-width="2" stroke-dasharray="8 10"/>
  <text x="1280" y="270" fill="#777c79" font-size="19" font-weight="820" text-anchor="middle" letter-spacing="1.2" opacity="1">AUG 2025</text>
  <circle cx="1280" cy="770" r="17" fill="#fffaf0" stroke="#ad4f5d" stroke-width="7"/>
  <text x="1280" y="716" fill="#ad4f5d" font-size="20" font-weight="820" text-anchor="middle" letter-spacing="0.6" opacity="1">PRODUCTION HALTED</text>
  <text x="1280" y="746" fill="#777c79" font-size="17" font-weight="560" text-anchor="middle" letter-spacing="0" opacity="1">China discourages sales</text>
</g>
<g>
  <path d="M1630 286L1630 840" fill="none" stroke="#ddd5c8" stroke-width="2" stroke-dasharray="8 10"/>
  <text x="1630" y="270" fill="#777c79" font-size="19" font-weight="820" text-anchor="middle" letter-spacing="1.2" opacity="1">JAN 2026</text>
  <circle cx="1630" cy="570" r="17" fill="#fffaf0" stroke="#7358a3" stroke-width="7"/>
  <text x="1630" y="630" fill="#7358a3" font-size="20" font-weight="820" text-anchor="middle" letter-spacing="0.6" opacity="1">H200 CASE-BY-CASE</text>
  <text x="1630" y="660" fill="#777c79" font-size="17" font-weight="560" text-anchor="middle" letter-spacing="0" opacity="1">conditional review</text>
</g>
<text x="960" y="930" fill="#3977a8" font-size="22" font-weight="760" text-anchor="end" letter-spacing="0" opacity="1">H20 compliance route</text>
<path d="M982 923L1138 923" fill="none" stroke="#4f5965" stroke-width="4" marker-end="url(#arrow-ink)"/>
<text x="1160" y="930" fill="#7358a3" font-size="22" font-weight="760" text-anchor="start" letter-spacing="0" opacity="1">H200 case-by-case review</text>
</svg>
