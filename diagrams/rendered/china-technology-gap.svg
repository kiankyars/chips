<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title id="title">China has different gaps in lithography, memory, and EDA</title>
<desc id="desc">A comparison table lists the reported domestic state and a relevant external reference for EUV, DUV, HBM, and EDA without placing unlike metrics on one numeric scale.</desc>
<defs>
  <pattern id="paper-grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#ddd5c8" stroke-width="1" opacity="0.22"/>
  </pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#493f30" flood-opacity="0.13"/>
  </filter>
  <marker id="arrow-ink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#4f5965"/>
  </marker>
  <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#3977a8"/>
  </marker>
  <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#397a66"/>
  </marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#ad4f5d"/>
  </marker>
</defs>
<rect width="1920" height="1080" fill="#f4efe6"/>
<rect width="1920" height="1080" fill="url(#paper-grid)"/>
<text x="84" y="72" fill="#777c79" font-size="21" font-weight="780" text-anchor="start" letter-spacing="2.2" opacity="1">TECHNOLOGY SUBSTITUTION</text>
<text x="84" y="136" fill="#1f272d" font-size="52" font-weight="820" text-anchor="start" letter-spacing="0" opacity="1">China's technology gaps are not one number</text>
<text x="84" y="181" fill="#777c79" font-size="23" font-weight="540" text-anchor="start" letter-spacing="0" opacity="1">EUV power, lithography resolution, HBM timing, and EDA coverage require different comparisons.</text>
<path d="M84 210L1836 210" fill="none" stroke="#ddd5c8" stroke-width="2"/>
<text x="112" y="270" fill="#777c79" font-size="21" font-weight="780" text-anchor="start" letter-spacing="2.2" opacity="1">TECHNOLOGY</text>
<text x="430" y="270" fill="#777c79" font-size="21" font-weight="780" text-anchor="start" letter-spacing="2.2" opacity="1">REPORTED DOMESTIC STATE</text>
<text x="1040" y="270" fill="#777c79" font-size="21" font-weight="780" text-anchor="start" letter-spacing="2.2" opacity="1">EXTERNAL REFERENCE / LIMIT</text>
<g>
  <path d="M102 400L1818 400" fill="none" stroke="#ddd5c8" stroke-width="2"/>
  <rect x="108" y="306" width="12" height="72" rx="6" fill="#bd7b25"/>
  <text x="150" y="350" fill="#bd7b25" font-size="32" font-weight="840" text-anchor="start" letter-spacing="0" opacity="1">EUV</text>
  <text x="430" y="350" fill="#1f272d" font-size="23" font-weight="680" text-anchor="start" letter-spacing="0" opacity="1">Prototype · 100–150 W</text>
  <text x="1040" y="350" fill="#1f272d" font-size="22" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">Below production; source trails ASML's 2017 benchmark</text>
</g>
<g>
  <path d="M102 550L1818 550" fill="none" stroke="#ddd5c8" stroke-width="2"/>
  <rect x="108" y="456" width="12" height="72" rx="6" fill="#ad4f5d"/>
  <text x="150" y="500" fill="#ad4f5d" font-size="32" font-weight="840" text-anchor="start" letter-spacing="0" opacity="1">DUV</text>
  <text x="430" y="500" fill="#1f272d" font-size="23" font-weight="680" text-anchor="start" letter-spacing="0" opacity="1">110 nm dry scanner</text>
  <text x="1040" y="500" fill="#1f272d" font-size="22" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">Not the claimed 28 nm immersion class</text>
</g>
<g>
  <path d="M102 700L1818 700" fill="none" stroke="#ddd5c8" stroke-width="2"/>
  <rect x="108" y="606" width="12" height="72" rx="6" fill="#7358a3"/>
  <text x="150" y="650" fill="#7358a3" font-size="32" font-weight="840" text-anchor="start" letter-spacing="0" opacity="1">HBM</text>
  <text x="430" y="650" fill="#1f272d" font-size="23" font-weight="680" text-anchor="start" letter-spacing="0" opacity="1">HBM3 targeted end-2026</text>
  <text x="1040" y="650" fill="#1f272d" font-size="22" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">About 3–4 years behind Korea</text>
</g>
<g>
  <path d="M102 850L1818 850" fill="none" stroke="#ddd5c8" stroke-width="2"/>
  <rect x="108" y="756" width="12" height="72" rx="6" fill="#3977a8"/>
  <text x="150" y="800" fill="#3977a8" font-size="32" font-weight="840" text-anchor="start" letter-spacing="0" opacity="1">EDA</text>
  <text x="430" y="800" fill="#1f272d" font-size="23" font-weight="680" text-anchor="start" letter-spacing="0" opacity="1">Empyrean · ~10–12% of China market</text>
  <text x="1040" y="800" fill="#1f272d" font-size="22" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">Advanced flows still rely on foreign tools</text>
</g>
</svg>
