<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title id="title">All-reduce sums every GPU gradient and returns the result to all GPUs</title>
<desc id="desc">Four GPUs begin with local gradient arrays. Reduce-scatter leaves one summed shard on each GPU, then all-gather leaves the same complete summed array on every GPU.</desc>
<defs>
  <pattern id="network-grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#ded7cb" stroke-width="1" opacity="0.24"/>
  </pattern>
  <filter id="network-shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#493f30" flood-opacity="0.12"/>
  </filter>
  <marker id="network-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#515b64"/>
  </marker>
  <marker id="network-arrow-rose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#b24956"/>
  </marker>
</defs>
<rect width="1920" height="1080" fill="#f3efe7"/>
<rect width="1920" height="1080" fill="url(#network-grid)"/>
<text x="104" y="92" fill="#747a76" font-size="20" font-weight="760" text-anchor="start" letter-spacing="3.6" opacity="1">COLLECTIVE COMMUNICATION</text>
<text x="104" y="156" fill="#20252b" font-size="48" font-weight="760" text-anchor="start" letter-spacing="0" opacity="1">All-reduce sums gradients—then returns the result to all</text>
<path d="M104 190H1816" stroke="#cec6b9" stroke-width="2"/>
<rect x="104" y="230" width="510" height="670" rx="28" fill="#d9ebe3" stroke="#2f7b65" stroke-width="2.5" filter="url(#network-shadow)"/>
<rect x="705" y="230" width="510" height="670" rx="28" fill="#e7e0f0" stroke="#705a96" stroke-width="2.5" filter="url(#network-shadow)"/>
<rect x="1306" y="230" width="510" height="670" rx="28" fill="#dceaf3" stroke="#2f6f9f" stroke-width="2.5" filter="url(#network-shadow)"/>

<text x="359" y="298" fill="#2f7b65" font-size="22" font-weight="840" text-anchor="middle" letter-spacing="1.3" opacity="1">1 · LOCAL GRADIENTS</text>
<text x="359" y="338" fill="#747a76" font-size="18" font-weight="620" text-anchor="middle" letter-spacing="0" opacity="1">one full array per GPU</text>
