<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title id="title">Line rate is a ceiling, not training throughput</title>
<desc id="desc">An 800 gigabit per second adapter converts to a 100 gigabyte per second raw ceiling. Protocol overhead, shared-path contention, and topology plus software narrow the useful collective rate. A separate synchronization timeline shows the slowest participant delaying the next compute step.</desc>
<defs>
  <pattern id="network-grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#ded7cb" stroke-width="1" opacity="0.24"/>
  </pattern>
  <filter id="network-shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#493f30" flood-opacity="0.12"/>
  </filter>
  <marker id="network-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#515b64"/>
  </marker>
  <marker id="network-arrow-rose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#b24956"/>
  </marker>
</defs>
<rect width="1920" height="1080" fill="#f3efe7"/>
<rect width="1920" height="1080" fill="url(#network-grid)"/>
<text x="104" y="92" fill="#747a76" font-size="20" font-weight="760" text-anchor="start" letter-spacing="3.6" opacity="1">BANDWIDTH BUDGET</text>
<text x="104" y="156" fill="#20252b" font-size="48" font-weight="760" text-anchor="start" letter-spacing="0" opacity="1">Line rate is a ceiling—not training throughput</text>
<path d="M104 190H1816" stroke="#cec6b9" stroke-width="2"/>

<text x="132" y="280" fill="#747a76" font-size="18" font-weight="780" text-anchor="start" letter-spacing="2.2" opacity="1">UNIT CONVERSION</text>
<g filter="url(#network-shadow)">
  <path d="M132 354H424L488 512L424 670H132Z" fill="#2f7b65" opacity="0.9"/>
  <text x="280" y="476" fill="#fffaf0" font-size="52" font-weight="840" text-anchor="middle" letter-spacing="0" opacity="1">800 Gb/s</text>
  <text x="280" y="522" fill="#fffaf0" font-size="18" font-weight="760" text-anchor="middle" letter-spacing="1.7" opacity="1">ADAPTER LINE RATE</text>
</g>
<circle cx="518" cy="512" r="58" fill="#fffaf0" stroke="#cec6b9" stroke-width="3"/>
<text x="518" y="506" fill="#20252b" font-size="31" font-weight="820" text-anchor="middle" letter-spacing="0" opacity="1">÷ 8</text>
<text x="518" y="538" fill="#747a76" font-size="15" font-weight="620" text-anchor="middle" letter-spacing="0" opacity="1">bits / byte</text>

<defs>
  <linearGradient id="throughput-band" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2f6f9f" stop-opacity="0.92"/>
    <stop offset="100%" stop-color="#705a96" stop-opacity="0.88"/>
  </linearGradient>
</defs>
<path d="M604 378H792L1690 464V560L792 646H604Z" fill="url(#throughput-band)" filter="url(#network-shadow)"/>
<path d="M604 378H792L1690 464" fill="none" stroke="#2f6f9f" stroke-width="4" opacity="0.7"/>
<path d="M604 646H792L1690 560" fill="none" stroke="#705a96" stroke-width="4" opacity="0.7"/>
<text x="704" y="488" fill="#fffaf0" font-size="48" font-weight="840" text-anchor="middle" letter-spacing="0" opacity="1">100 GB/s</text>
<text x="704" y="532" fill="#fffaf0" font-size="17" font-weight="760" text-anchor="middle" letter-spacing="1.5" opacity="1">RAW BYTE CEILING</text>
<text x="1540" y="492" fill="#fffaf0" font-size="19" font-weight="800" text-anchor="middle" letter-spacing="1.1" opacity="1">USEFUL COLLECTIVE</text>
<text x="1540" y="529" fill="#fffaf0" font-size="28" font-weight="840" text-anchor="middle" letter-spacing="1.5" opacity="1">THROUGHPUT</text>

<g>
<path d="M924 376V648" stroke="#b24956" stroke-width="4" stroke-dasharray="10 9" opacity="0.75"/>
<circle cx="924" cy="668" r="7" fill="#b24956"/>
<text x="924" y="713" fill="#b24956" font-size="20" font-weight="820" text-anchor="middle" letter-spacing="1.1" opacity="1">PROTOCOL</text>
<text x="924" y="745" fill="#747a76" font-size="16" font-weight="620" text-anchor="middle" letter-spacing="0" opacity="1">headers + encoding</text>
</g>
<g>
<path d="M1190 376V648" stroke="#b87821" stroke-width="4" stroke-dasharray="10 9" opacity="0.75"/>
<circle cx="1190" cy="668" r="7" fill="#b87821"/>
<text x="1190" y="713" fill="#b87821" font-size="20" font-weight="820" text-anchor="middle" letter-spacing="1.1" opacity="1">CONTENTION</text>
<text x="1190" y="745" fill="#747a76" font-size="16" font-weight="620" text-anchor="middle" letter-spacing="0" opacity="1">shared paths</text>
</g>
<g>
<path d="M1450 376V648" stroke="#705a96" stroke-width="4" stroke-dasharray="10 9" opacity="0.75"/>
<circle cx="1450" cy="668" r="7" fill="#705a96"/>
<text x="1450" y="713" fill="#705a96" font-size="20" font-weight="820" text-anchor="middle" letter-spacing="1.1" opacity="1">TOPOLOGY + SOFTWARE</text>
<text x="1450" y="745" fill="#747a76" font-size="16" font-weight="620" text-anchor="middle" letter-spacing="0" opacity="1">hops + collective mapping</text>
</g>
<text x="960" y="782" fill="#747a76" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="1.7" opacity="1">QUALITATIVE NARROWING · NO FIXED LOSS SHARE</text>

<path d="M132 842H1788" stroke="#cec6b9" stroke-width="2"/>
<text x="132" y="892" fill="#2f6f9f" font-size="18" font-weight="820" text-anchor="start" letter-spacing="2" opacity="1">SYNCHRONIZATION LATENCY</text>
<path d="M444 885H1570" stroke="#515b64" stroke-width="4" marker-end="url(#network-arrow)" opacity="0.62"/>
<circle cx="690" cy="885" r="12" fill="#2f7b65"/><path d="M690 885V930" stroke="#2f7b65" stroke-width="3" opacity="0.62"/>
<circle cx="820" cy="885" r="12" fill="#2f7b65"/><path d="M820 885V938" stroke="#2f7b65" stroke-width="3" opacity="0.62"/>
<circle cx="950" cy="885" r="12" fill="#2f7b65"/><path d="M950 885V946" stroke="#2f7b65" stroke-width="3" opacity="0.62"/>
<circle cx="1350" cy="885" r="14" fill="#b24956"/>
<path d="M950 945H1350" stroke="#b24956" stroke-width="5" stroke-linecap="round"/>
<text x="820" y="978" fill="#2f7b65" font-size="18" font-weight="720" text-anchor="middle" letter-spacing="0" opacity="1">most participants ready</text>
<text x="1350" y="978" fill="#b24956" font-size="18" font-weight="760" text-anchor="middle" letter-spacing="0" opacity="1">slowest participant</text>
<path d="M1400 830V956" stroke="#b24956" stroke-width="3" stroke-dasharray="8 7"/>
<rect x="1518" y="846" width="270" height="78" rx="18" fill="#dceaf3" stroke="#2f6f9f" stroke-width="3"/>
<text x="1653" y="878" fill="#2f6f9f" font-size="18" font-weight="820" text-anchor="middle" letter-spacing="1.1" opacity="1">NEXT COMPUTE</text>
<text x="1653" y="905" fill="#2f6f9f" font-size="18" font-weight="820" text-anchor="middle" letter-spacing="1.1" opacity="1">STEP RESUMES</text>
</svg>
