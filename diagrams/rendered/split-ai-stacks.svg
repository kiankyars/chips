<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title id="title">The United States led and China led AI stacks are diverging but still interdependent</title>
<desc id="desc">Aligned rows compare accelerators, software, foundries, and production tools in the United States led and China led AI stacks. The tools row makes continuing foreign dependencies explicit.</desc>
<defs>
  <pattern id="paper-grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#ddd5c8" stroke-width="1" opacity="0.22"/>
  </pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#493f30" flood-opacity="0.13"/>
  </filter>
  <marker id="arrow-ink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#4f5965"/>
  </marker>
  <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#3977a8"/>
  </marker>
  <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#397a66"/>
  </marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#ad4f5d"/>
  </marker>
</defs>
<rect width="1920" height="1080" fill="#f4efe6"/>
<rect width="1920" height="1080" fill="url(#paper-grid)"/>
<text x="84" y="72" fill="#777c79" font-size="21" font-weight="780" text-anchor="start" letter-spacing="2.2" opacity="1">AI ECOSYSTEMS</text>
<text x="84" y="136" fill="#1f272d" font-size="52" font-weight="820" text-anchor="start" letter-spacing="0" opacity="1">Two AI stacks are diverging, not yet independent</text>
<text x="84" y="181" fill="#777c79" font-size="23" font-weight="540" text-anchor="start" letter-spacing="0" opacity="1">Accelerators and software differ; tools and materials still cross borders.</text>
<path d="M84 210L1836 210" fill="none" stroke="#ddd5c8" stroke-width="2"/>
<text x="170" y="280" fill="#3977a8" font-size="21" font-weight="780" text-anchor="start" letter-spacing="2.2" opacity="1">US-LED</text>
<text x="960" y="280" fill="#777c79" font-size="21" font-weight="780" text-anchor="middle" letter-spacing="2.2" opacity="1">LAYER</text>
<text x="1750" y="280" fill="#ad4f5d" font-size="21" font-weight="780" text-anchor="end" letter-spacing="2.2" opacity="1">CHINA-LED</text>
<g>
  <path d="M112 424L1808 424" fill="none" stroke="#ddd5c8" stroke-width="2"/>
  <text x="170" y="368" fill="#1f272d" font-size="30" font-weight="720" text-anchor="start" letter-spacing="0" opacity="1">Nvidia GPU</text>
  <text x="1750" y="368" fill="#1f272d" font-size="30" font-weight="720" text-anchor="end" letter-spacing="0" opacity="1">Huawei Ascend</text>
  <text x="960" y="368" fill="#3977a8" font-size="21" font-weight="840" text-anchor="middle" letter-spacing="1.2" opacity="1">ACCELERATOR</text>
</g>
<g>
  <path d="M112 564L1808 564" fill="none" stroke="#ddd5c8" stroke-width="2"/>
  <text x="170" y="508" fill="#1f272d" font-size="30" font-weight="720" text-anchor="start" letter-spacing="0" opacity="1">CUDA</text>
  <text x="1750" y="508" fill="#1f272d" font-size="30" font-weight="720" text-anchor="end" letter-spacing="0" opacity="1">CANN</text>
  <text x="960" y="508" fill="#7358a3" font-size="21" font-weight="840" text-anchor="middle" letter-spacing="1.2" opacity="1">SOFTWARE</text>
</g>
<g>
  <path d="M112 704L1808 704" fill="none" stroke="#ddd5c8" stroke-width="2"/>
  <text x="170" y="648" fill="#1f272d" font-size="30" font-weight="720" text-anchor="start" letter-spacing="0" opacity="1">TSMC</text>
  <text x="1750" y="648" fill="#1f272d" font-size="30" font-weight="720" text-anchor="end" letter-spacing="0" opacity="1">SMIC</text>
  <text x="960" y="648" fill="#397a66" font-size="21" font-weight="840" text-anchor="middle" letter-spacing="1.2" opacity="1">FOUNDRY</text>
</g>
<g>
  <path d="M112 844L1808 844" fill="none" stroke="#ddd5c8" stroke-width="2"/>
  <text x="170" y="788" fill="#1f272d" font-size="25" font-weight="720" text-anchor="start" letter-spacing="0" opacity="1">ASML + US/Japan equipment</text>
  <text x="1750" y="788" fill="#1f272d" font-size="23" font-weight="720" text-anchor="end" letter-spacing="0" opacity="1">Domestic tools + foreign dependencies</text>
  <text x="960" y="788" fill="#bd7b25" font-size="21" font-weight="840" text-anchor="middle" letter-spacing="1.2" opacity="1">TOOLS</text>
</g>
<text x="960" y="975" fill="#ad4f5d" font-size="31" font-weight="760" text-anchor="middle" letter-spacing="0" opacity="1">Divergence is real; self-sufficiency is not.</text>
</svg>
