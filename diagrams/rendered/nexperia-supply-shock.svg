<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title id="title">A Nexperia control dispute created an automotive supply shock</title>
<desc id="desc">A four-step causal timeline connects the Dutch government control order, China's Dongguan export block, more than fifty billion mature-node chips per year, and automaker warnings of production stoppages within days.</desc>
<defs>
  <pattern id="paper-grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#ddd5c8" stroke-width="1" opacity="0.22"/>
  </pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#493f30" flood-opacity="0.13"/>
  </filter>
  <marker id="arrow-ink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#4f5965"/>
  </marker>
  <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#3977a8"/>
  </marker>
  <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#397a66"/>
  </marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#ad4f5d"/>
  </marker>
</defs>
<rect width="1920" height="1080" fill="#f4efe6"/>
<rect width="1920" height="1080" fill="url(#paper-grid)"/>
<text x="84" y="72" fill="#777c79" font-size="21" font-weight="780" text-anchor="start" letter-spacing="2.2" opacity="1">MATURE-NODE LEVERAGE</text>
<text x="84" y="136" fill="#1f272d" font-size="52" font-weight="820" text-anchor="start" letter-spacing="0" opacity="1">A chip-control dispute became an automotive supply shock</text>
<text x="84" y="181" fill="#777c79" font-size="23" font-weight="540" text-anchor="start" letter-spacing="0" opacity="1">The vulnerable component was a high-volume, cents-priced mature-node part.</text>
<path d="M84 210L1836 210" fill="none" stroke="#ddd5c8" stroke-width="2"/>
<path d="M158 520L1760 520" fill="none" stroke="#4f5965" stroke-width="6" marker-end="url(#arrow-ink)"/>
<g>
  <circle cx="250" cy="520" r="27" fill="#3977a8"/>
  <text x="250" y="529" fill="#fffaf0" font-size="24" font-weight="850" text-anchor="middle" letter-spacing="0" opacity="1">1</text>
  <text x="250" y="382" fill="#3977a8" font-size="23" font-weight="840" text-anchor="middle" letter-spacing="1" opacity="1">SEP 2025</text>
  <text x="250" y="625" fill="#1f272d" font-size="22" font-weight="820" text-anchor="middle" letter-spacing="0.5" opacity="1">DUTCH CONTROL ORDER</text>
  <text x="250" y="662" fill="#777c79" font-size="19" font-weight="560" text-anchor="middle" letter-spacing="0" opacity="1">technology-transfer concerns</text>
</g>
<g>
  <circle cx="700" cy="520" r="27" fill="#ad4f5d"/>
  <text x="700" y="529" fill="#fffaf0" font-size="24" font-weight="850" text-anchor="middle" letter-spacing="0" opacity="1">2</text>
  <text x="700" y="382" fill="#ad4f5d" font-size="23" font-weight="840" text-anchor="middle" letter-spacing="1" opacity="1">OCT 2025</text>
  <text x="700" y="625" fill="#1f272d" font-size="22" font-weight="820" text-anchor="middle" letter-spacing="0.5" opacity="1">CHINA BLOCKS EXPORTS</text>
  <text x="700" y="662" fill="#777c79" font-size="19" font-weight="560" text-anchor="middle" letter-spacing="0" opacity="1">Nexperia · Dongguan</text>
</g>
<g>
  <circle cx="1150" cy="520" r="27" fill="#bd7b25"/>
  <text x="1150" y="529" fill="#fffaf0" font-size="24" font-weight="850" text-anchor="middle" letter-spacing="0" opacity="1">3</text>
  <text x="1150" y="382" fill="#bd7b25" font-size="23" font-weight="840" text-anchor="middle" letter-spacing="1" opacity="1">SUPPLY EXPOSURE</text>
  <text x="1150" y="625" fill="#1f272d" font-size="20" font-weight="820" text-anchor="middle" letter-spacing="0.5" opacity="1">&gt;50B SIMPLE CHIPS / YEAR</text>
  <text x="1150" y="662" fill="#777c79" font-size="19" font-weight="560" text-anchor="middle" letter-spacing="0" opacity="1">mature-node volume</text>
</g>
<g>
  <circle cx="1600" cy="520" r="27" fill="#ad4f5d"/>
  <text x="1600" y="529" fill="#fffaf0" font-size="24" font-weight="850" text-anchor="middle" letter-spacing="0" opacity="1">4</text>
  <text x="1600" y="382" fill="#ad4f5d" font-size="23" font-weight="840" text-anchor="middle" letter-spacing="1" opacity="1">CONSEQUENCE</text>
  <text x="1600" y="625" fill="#1f272d" font-size="22" font-weight="820" text-anchor="middle" letter-spacing="0.5" opacity="1">AUTOMAKERS WARN</text>
  <text x="1600" y="662" fill="#777c79" font-size="19" font-weight="560" text-anchor="middle" letter-spacing="0" opacity="1">within days · production stoppages</text>
</g>
<text x="960" y="880" fill="#1f272d" font-size="31" font-weight="700" text-anchor="middle" letter-spacing="0" opacity="1">Cents-priced mature-node parts became the bottleneck.</text>
</svg>
