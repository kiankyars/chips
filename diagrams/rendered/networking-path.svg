<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title id="title">GPUDirect RDMA avoids CPU-memory payload copies</title>
<desc id="desc">The payload travels symmetrically from source GPU memory through a SuperNIC and leaf-spine fabric to a destination SuperNIC and GPU memory. Optical links carry the longer fabric reach, while host CPUs set up but do not copy the payload.</desc>
<defs>
  <pattern id="network-grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#ded7cb" stroke-width="1" opacity="0.24"/>
  </pattern>
  <filter id="network-shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#493f30" flood-opacity="0.12"/>
  </filter>
  <marker id="network-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#515b64"/>
  </marker>
  <marker id="network-arrow-rose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#b24956"/>
  </marker>
</defs>
<rect width="1920" height="1080" fill="#f3efe7"/>
<rect width="1920" height="1080" fill="url(#network-grid)"/>
<text x="104" y="92" fill="#747a76" font-size="20" font-weight="760" text-anchor="start" letter-spacing="3.6" opacity="1">THE PHYSICAL DATA PATH</text>
<text x="104" y="156" fill="#20252b" font-size="48" font-weight="760" text-anchor="start" letter-spacing="0" opacity="1">GPUDirect RDMA avoids a CPU-memory payload bounce</text>
<path d="M104 190H1816" stroke="#cec6b9" stroke-width="2"/>

<rect x="150" y="248" width="430" height="126" rx="22" fill="#cec6b9" opacity="0.2" stroke="#515b64" stroke-width="3" stroke-dasharray="9 7"/>
<text x="365" y="296" fill="#515b64" font-size="21" font-weight="800" text-anchor="middle" letter-spacing="1" opacity="1">SOURCE HOST CPU + MEMORY</text>
<text x="365" y="336" fill="#747a76" font-size="17" font-weight="620" text-anchor="middle" letter-spacing="0" opacity="1">control only · no payload copy</text>
<rect x="1240" y="248" width="430" height="126" rx="22" fill="#cec6b9" opacity="0.2" stroke="#515b64" stroke-width="3" stroke-dasharray="9 7"/>
<text x="1455" y="296" fill="#515b64" font-size="21" font-weight="800" text-anchor="middle" letter-spacing="1" opacity="1">DESTINATION HOST CPU + MEMORY</text>
<text x="1455" y="336" fill="#747a76" font-size="17" font-weight="620" text-anchor="middle" letter-spacing="0" opacity="1">control only · no payload copy</text>

<path d="M225 480C250 420 280 390 312 374M520 374C500 420 490 450 475 480" fill="none" stroke="#515b64" stroke-width="3.5" stroke-dasharray="10 8" opacity="0.5"/>
<path d="M1595 480C1570 420 1540 390 1508 374M1300 374C1320 420 1330 450 1345 480" fill="none" stroke="#515b64" stroke-width="3.5" stroke-dasharray="10 8" opacity="0.5"/>
<path d="M338 402L374 438M374 402L338 438M1446 402L1482 438M1482 402L1446 438" fill="none" stroke="#b24956" stroke-width="7" stroke-linecap="round"/>

<rect x="748" y="414" width="324" height="44" rx="22" fill="#f1dadd" stroke="#b24956" stroke-width="2.5"/>
<text x="910" y="443" fill="#b24956" font-size="17" font-weight="840" text-anchor="middle" letter-spacing="1.1" opacity="1">OPTICAL FABRIC LINKS</text>

<path d="M348 580L373 580" fill="none" stroke="#515b64" stroke-width="5" stroke-linecap="round" marker-end="url(#network-arrow)" opacity="1"/>
<path d="M573 580L598 580" fill="none" stroke="#515b64" stroke-width="5" stroke-linecap="round" marker-end="url(#network-arrow)" opacity="1"/>
<path d="M788 580L813 580" fill="none" stroke="#b24956" stroke-width="5" stroke-linecap="round" marker-end="url(#network-arrow-rose)" opacity="1"/>
<path d="M1003 580L1028 580" fill="none" stroke="#b24956" stroke-width="5" stroke-linecap="round" marker-end="url(#network-arrow-rose)" opacity="1"/>
<path d="M1218 580L1243 580" fill="none" stroke="#515b64" stroke-width="5" stroke-linecap="round" marker-end="url(#network-arrow)" opacity="1"/>
<path d="M1443 580L1468 580" fill="none" stroke="#515b64" stroke-width="5" stroke-linecap="round" marker-end="url(#network-arrow)" opacity="1"/>
<g>
<rect x="110" y="500" width="230" height="160" rx="22" fill="#2f7b65" opacity="0.11" stroke="#2f7b65" stroke-width="4" filter="url(#network-shadow)"/>
<text x="225" y="562" fill="#2f7b65" font-size="21" font-weight="820" text-anchor="middle" letter-spacing="0" opacity="1">GPU MEMORY</text>
<text x="225" y="604" fill="#747a76" font-size="16" font-weight="620" text-anchor="middle" letter-spacing="0" opacity="1">source tensors</text>
</g>
<g>
<rect x="385" y="500" width="180" height="160" rx="22" fill="#2f6f9f" opacity="0.11" stroke="#2f6f9f" stroke-width="4" filter="url(#network-shadow)"/>
<text x="475" y="562" fill="#2f6f9f" font-size="21" font-weight="820" text-anchor="middle" letter-spacing="0" opacity="1">SUPERNIC</text>
<text x="475" y="604" fill="#747a76" font-size="16" font-weight="620" text-anchor="middle" letter-spacing="0" opacity="1">RDMA endpoint</text>
</g>
<g>
<rect x="610" y="500" width="170" height="160" rx="22" fill="#705a96" opacity="0.11" stroke="#705a96" stroke-width="4" filter="url(#network-shadow)"/>
<text x="695" y="562" fill="#705a96" font-size="21" font-weight="820" text-anchor="middle" letter-spacing="0" opacity="1">LEAF</text>
<text x="695" y="604" fill="#747a76" font-size="16" font-weight="620" text-anchor="middle" letter-spacing="0" opacity="1">source rack</text>
</g>
<g>
<rect x="825" y="500" width="170" height="160" rx="22" fill="#b87821" opacity="0.11" stroke="#b87821" stroke-width="4" filter="url(#network-shadow)"/>
<text x="910" y="562" fill="#b87821" font-size="21" font-weight="820" text-anchor="middle" letter-spacing="0" opacity="1">SPINE</text>
<text x="910" y="604" fill="#747a76" font-size="16" font-weight="620" text-anchor="middle" letter-spacing="0" opacity="1">fabric core</text>
</g>
<g>
<rect x="1040" y="500" width="170" height="160" rx="22" fill="#705a96" opacity="0.11" stroke="#705a96" stroke-width="4" filter="url(#network-shadow)"/>
<text x="1125" y="562" fill="#705a96" font-size="21" font-weight="820" text-anchor="middle" letter-spacing="0" opacity="1">LEAF</text>
<text x="1125" y="604" fill="#747a76" font-size="16" font-weight="620" text-anchor="middle" letter-spacing="0" opacity="1">destination rack</text>
</g>
<g>
<rect x="1255" y="500" width="180" height="160" rx="22" fill="#2f6f9f" opacity="0.11" stroke="#2f6f9f" stroke-width="4" filter="url(#network-shadow)"/>
<text x="1345" y="562" fill="#2f6f9f" font-size="21" font-weight="820" text-anchor="middle" letter-spacing="0" opacity="1">SUPERNIC</text>
<text x="1345" y="604" fill="#747a76" font-size="16" font-weight="620" text-anchor="middle" letter-spacing="0" opacity="1">RDMA endpoint</text>
</g>
<g>
<rect x="1480" y="500" width="230" height="160" rx="22" fill="#2f7b65" opacity="0.11" stroke="#2f7b65" stroke-width="4" filter="url(#network-shadow)"/>
<text x="1595" y="562" fill="#2f7b65" font-size="21" font-weight="820" text-anchor="middle" letter-spacing="0" opacity="1">GPU MEMORY</text>
<text x="1595" y="604" fill="#747a76" font-size="16" font-weight="620" text-anchor="middle" letter-spacing="0" opacity="1">destination tensors</text>
</g>

<text x="338" y="730" fill="#2f7b65" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="1.7" opacity="1">SOURCE ENDPOINT</text>
<text x="910" y="730" fill="#705a96" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="1.7" opacity="1">PACKET FABRIC</text>
<text x="1482" y="730" fill="#2f7b65" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="1.7" opacity="1">DESTINATION ENDPOINT</text>

<text x="960" y="948" fill="#20252b" font-size="20" font-weight="820" text-anchor="middle" letter-spacing="1.4" opacity="1">HOST CPUS SET UP THE TRANSFER · THE PAYLOAD STAYS ON THE GPU-TO-NETWORK PATH</text>
</svg>
