<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title id="title">United States semiconductor controls expanded in scope from 2019 through 2024</title>
<desc id="desc">Four progressively wider bands show controls moving from one named company to foreign production, advanced technologies, and broad supply categories.</desc>
<defs>
  <pattern id="paper-grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#ddd5c8" stroke-width="1" opacity="0.22"/>
  </pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#493f30" flood-opacity="0.13"/>
  </filter>
  <marker id="arrow-ink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#4f5965"/>
  </marker>
  <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#3977a8"/>
  </marker>
  <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#397a66"/>
  </marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#ad4f5d"/>
  </marker>
</defs>
<rect width="1920" height="1080" fill="#f4efe6"/>
<rect width="1920" height="1080" fill="url(#paper-grid)"/>
<text x="84" y="72" fill="#777c79" font-size="21" font-weight="780" text-anchor="start" letter-spacing="2.2" opacity="1">CONTROL SCOPE · 2019–2024</text>
<text x="84" y="136" fill="#1f272d" font-size="52" font-weight="820" text-anchor="start" letter-spacing="0" opacity="1">US controls widened from one company to an upstream technology stack</text>
<text x="84" y="181" fill="#777c79" font-size="23" font-weight="540" text-anchor="start" letter-spacing="0" opacity="1">The bands show categories added over time; their widths are ordinal, not quantitative.</text>
<path d="M84 210L1836 210" fill="none" stroke="#ddd5c8" stroke-width="2"/>
<g>
  <text x="112" y="362" fill="#ad4f5d" font-size="22" font-weight="820" text-anchor="start" letter-spacing="1.2" opacity="1">MAY 2019</text>
  <rect x="310" y="330" width="430" height="68" rx="8" fill="#efd9dc" stroke="#ad4f5d" stroke-width="3"/>
  <text x="344" y="359" fill="#ad4f5d" font-size="20" font-weight="820" text-anchor="start" letter-spacing="1.4" opacity="1">NAMED COMPANY</text>
  <text x="344" y="385" fill="#1f272d" font-size="18" font-weight="610" text-anchor="start" letter-spacing="0" opacity="1">Huawei · Entity List</text>
</g>
<g>
  <text x="112" y="507" fill="#ad4f5d" font-size="22" font-weight="820" text-anchor="start" letter-spacing="1.2" opacity="1">MAY 2020</text>
  <rect x="310" y="475" width="760" height="68" rx="8" fill="#efd9dc" stroke="#ad4f5d" stroke-width="3"/>
  <text x="344" y="504" fill="#ad4f5d" font-size="20" font-weight="820" text-anchor="start" letter-spacing="1.4" opacity="1">FOREIGN PRODUCTION</text>
  <text x="344" y="530" fill="#1f272d" font-size="18" font-weight="610" text-anchor="start" letter-spacing="0" opacity="1">FDPR reaches foreign fabs</text>
</g>
<g>
  <text x="112" y="652" fill="#ad4f5d" font-size="22" font-weight="820" text-anchor="start" letter-spacing="1.2" opacity="1">OCT 2022</text>
  <rect x="310" y="620" width="1090" height="68" rx="8" fill="#efd9dc" stroke="#ad4f5d" stroke-width="3"/>
  <text x="344" y="649" fill="#ad4f5d" font-size="20" font-weight="820" text-anchor="start" letter-spacing="1.4" opacity="1">ADVANCED TECHNOLOGIES</text>
  <text x="344" y="675" fill="#1f272d" font-size="18" font-weight="610" text-anchor="start" letter-spacing="0" opacity="1">advanced chips + fab tools</text>
</g>
<g>
  <text x="112" y="797" fill="#ad4f5d" font-size="22" font-weight="820" text-anchor="start" letter-spacing="1.2" opacity="1">DEC 2024</text>
  <rect x="310" y="765" width="1430" height="68" rx="8" fill="#efd9dc" stroke="#ad4f5d" stroke-width="3"/>
  <text x="344" y="794" fill="#ad4f5d" font-size="20" font-weight="820" text-anchor="start" letter-spacing="1.4" opacity="1">SUPPLY CATEGORIES</text>
  <text x="344" y="820" fill="#1f272d" font-size="18" font-weight="610" text-anchor="start" letter-spacing="0" opacity="1">HBM · 140 entities · 27 categories</text>
</g>
<path d="M1780 318L1780 855" fill="none" stroke="#ad4f5d" stroke-width="5" marker-end="url(#arrow-red)"/>
<text x="1748" y="300" fill="#ad4f5d" font-size="18" font-weight="820" text-anchor="end" letter-spacing="1.7" opacity="1">WIDER REACH</text>
<text x="960" y="955" fill="#1f272d" font-size="28" font-weight="650" text-anchor="middle" letter-spacing="0" opacity="1">From a named firm to the capability required to build advanced chips.</text>
</svg>
