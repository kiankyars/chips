<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title id="title">China mirrored United States semiconductor controls within twenty-four hours</title>
<desc id="desc">A causal timeline links the December 2 2024 United States HBM export rule to China banning gallium and germanium exports to the United States one day later, followed by extraterritorial rare-earth rules in October 2025.</desc>
<defs>
  <pattern id="paper-grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#ddd5c8" stroke-width="1" opacity="0.22"/>
  </pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#493f30" flood-opacity="0.13"/>
  </filter>
  <marker id="arrow-ink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#4f5965"/>
  </marker>
  <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#3977a8"/>
  </marker>
  <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#397a66"/>
  </marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#ad4f5d"/>
  </marker>
</defs>
<rect width="1920" height="1080" fill="#f4efe6"/>
<rect width="1920" height="1080" fill="url(#paper-grid)"/>
<text x="84" y="72" fill="#777c79" font-size="21" font-weight="780" text-anchor="start" letter-spacing="2.2" opacity="1">MINERAL COUNTER-CONTROLS</text>
<text x="84" y="136" fill="#1f272d" font-size="52" font-weight="820" text-anchor="start" letter-spacing="0" opacity="1">China mirrored US controls within 24 hours</text>
<text x="84" y="181" fill="#777c79" font-size="23" font-weight="540" text-anchor="start" letter-spacing="0" opacity="1">The response moved from a bilateral mineral ban to rules that reach foreign-made goods.</text>
<path d="M84 210L1836 210" fill="none" stroke="#ddd5c8" stroke-width="2"/>
<path d="M166 520L1760 520" fill="none" stroke="#4f5965" stroke-width="6" marker-end="url(#arrow-ink)"/>
<g>
  <circle cx="300" cy="520" r="24" fill="#fffaf0" stroke="#3977a8" stroke-width="7"/>
  <text x="300" y="388" fill="#3977a8" font-size="21" font-weight="820" text-anchor="middle" letter-spacing="1.2" opacity="1">DEC 2, 2024</text>
  <text x="300" y="435" fill="#1f272d" font-size="27" font-weight="800" text-anchor="middle" letter-spacing="0" opacity="1">US BANS HBM</text>
  <text x="300" y="472" fill="#777c79" font-size="19" font-weight="560" text-anchor="middle" letter-spacing="0" opacity="1">to China</text>
</g>
<g>
  <rect x="485" y="476" width="220" height="88" rx="44" fill="#f1dfbd" stroke="#bd7b25" stroke-width="3"/>
  <text x="595" y="533" fill="#bd7b25" font-size="29" font-weight="840" text-anchor="middle" letter-spacing="1.5" opacity="1">24 HOURS</text>
</g>
<g>
  <circle cx="900" cy="520" r="24" fill="#fffaf0" stroke="#ad4f5d" stroke-width="7"/>
  <text x="900" y="388" fill="#ad4f5d" font-size="21" font-weight="820" text-anchor="middle" letter-spacing="1.2" opacity="1">DEC 3, 2024</text>
  <text x="900" y="435" fill="#1f272d" font-size="27" font-weight="800" text-anchor="middle" letter-spacing="0" opacity="1">CHINA BANS Ga + Ge</text>
  <text x="900" y="472" fill="#777c79" font-size="19" font-weight="560" text-anchor="middle" letter-spacing="0" opacity="1">to the United States</text>
</g>
<g>
  <circle cx="1420" cy="520" r="24" fill="#fffaf0" stroke="#7358a3" stroke-width="7"/>
  <text x="1420" y="388" fill="#7358a3" font-size="21" font-weight="820" text-anchor="middle" letter-spacing="1.2" opacity="1">OCT 2025</text>
  <text x="1420" y="435" fill="#1f272d" font-size="27" font-weight="800" text-anchor="middle" letter-spacing="0" opacity="1">RARE-EARTH FDPR</text>
  <text x="1420" y="472" fill="#777c79" font-size="19" font-weight="560" text-anchor="middle" letter-spacing="0" opacity="1">reaches foreign goods</text>
</g>
<path d="M1420 550L1420 714" fill="none" stroke="#7358a3" stroke-width="4" stroke-dasharray="10 9"/>
<rect x="1030" y="714" width="780" height="116" rx="18" fill="#fffaf0" stroke="#ddd5c8" stroke-width="3"/>
<text x="1420" y="758" fill="#bd7b25" font-size="19" font-weight="820" text-anchor="middle" letter-spacing="1.7" opacity="1">CURRENT PAUSES EXPIRE</text>
<text x="1420" y="800" fill="#1f272d" font-size="29" font-weight="800" text-anchor="middle" letter-spacing="0" opacity="1">NOV 10 + NOV 27, 2026</text>
<text x="960" y="946" fill="#1f272d" font-size="27" font-weight="650" text-anchor="middle" letter-spacing="0" opacity="1">The chokepoint moved from advanced chips to the minerals used across manufacturing.</text>
</svg>
