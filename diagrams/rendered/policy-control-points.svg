<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title id="title">Four policy controls act at different points in the semiconductor supply chain</title>
<desc id="desc">Four separate transaction arrows show gates at EDA software licensing, foreign fab orders under the foreign direct product rule, Dutch EUV shipment licensing, and United States chip imports.</desc>
<defs>
  <pattern id="paper-grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#ddd5c8" stroke-width="1" opacity="0.22"/>
  </pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#493f30" flood-opacity="0.13"/>
  </filter>
  <marker id="arrow-ink" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#4f5965"/>
  </marker>
  <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#3977a8"/>
  </marker>
  <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#397a66"/>
  </marker>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0 0L12 6L0 12Z" fill="#ad4f5d"/>
  </marker>
</defs>
<rect width="1920" height="1080" fill="#f4efe6"/>
<rect width="1920" height="1080" fill="url(#paper-grid)"/>
<text x="84" y="72" fill="#777c79" font-size="21" font-weight="780" text-anchor="start" letter-spacing="2.2" opacity="1">POLICY CONTROL POINTS</text>
<text x="84" y="136" fill="#1f272d" font-size="52" font-weight="820" text-anchor="start" letter-spacing="0" opacity="1">Four separate transactions can be blocked</text>
<text x="84" y="181" fill="#777c79" font-size="23" font-weight="540" text-anchor="start" letter-spacing="0" opacity="1">Leverage sits where software, fabrication, equipment, and finished chips change hands.</text>
<path d="M84 210L1836 210" fill="none" stroke="#ddd5c8" stroke-width="2"/>
<text x="118" y="270" fill="#777c79" font-size="21" font-weight="780" text-anchor="start" letter-spacing="2.2" opacity="1">SENDER</text>
<text x="700" y="270" fill="#777c79" font-size="21" font-weight="780" text-anchor="middle" letter-spacing="2.2" opacity="1">CONTROLLED TRANSACTION</text>
<text x="1010" y="270" fill="#777c79" font-size="21" font-weight="780" text-anchor="start" letter-spacing="2.2" opacity="1">RECIPIENT</text>
<text x="1350" y="270" fill="#777c79" font-size="21" font-weight="780" text-anchor="start" letter-spacing="2.2" opacity="1">POLICY LEVER</text>
<path d="M1260 286L1260 866" fill="none" stroke="#ddd5c8" stroke-width="2"/>
<g>
  <text x="118" y="378" fill="#1f272d" font-size="23" font-weight="680" text-anchor="start" letter-spacing="0" opacity="1">US supplier</text>
  <path d="M390 370L930 370" fill="none" stroke="#4f5965" stroke-width="5" marker-end="url(#arrow-ink)"/>
  <circle cx="700" cy="370" r="19" fill="#fffaf0" stroke="#3977a8" stroke-width="6"/>
  <path d="M700 328V412" stroke="#3977a8" stroke-width="6" stroke-linecap="round"/>
  <text x="700" y="320" fill="#3977a8" font-size="20" font-weight="830" text-anchor="middle" letter-spacing="0.8" opacity="1">EDA LICENSE</text>
  <text x="1010" y="378" fill="#1f272d" font-size="23" font-weight="680" text-anchor="start" letter-spacing="0" opacity="1">chip designer</text>
  <text x="1350" y="378" fill="#3977a8" font-size="21" font-weight="720" text-anchor="start" letter-spacing="0" opacity="1">US export control</text>
</g>
<g>
  <text x="118" y="528" fill="#1f272d" font-size="23" font-weight="680" text-anchor="start" letter-spacing="0" opacity="1">chip designer</text>
  <path d="M390 520L930 520" fill="none" stroke="#4f5965" stroke-width="5" marker-end="url(#arrow-ink)"/>
  <circle cx="700" cy="520" r="19" fill="#fffaf0" stroke="#397a66" stroke-width="6"/>
  <path d="M700 478V562" stroke="#397a66" stroke-width="6" stroke-linecap="round"/>
  <text x="700" y="470" fill="#397a66" font-size="20" font-weight="830" text-anchor="middle" letter-spacing="0.8" opacity="1">FAB ORDER</text>
  <text x="1010" y="528" fill="#1f272d" font-size="23" font-weight="680" text-anchor="start" letter-spacing="0" opacity="1">foreign fab</text>
  <text x="1350" y="528" fill="#397a66" font-size="21" font-weight="720" text-anchor="start" letter-spacing="0" opacity="1">FDPR reaches production</text>
</g>
<g>
  <text x="118" y="678" fill="#1f272d" font-size="23" font-weight="680" text-anchor="start" letter-spacing="0" opacity="1">ASML</text>
  <path d="M390 670L930 670" fill="none" stroke="#4f5965" stroke-width="5" marker-end="url(#arrow-ink)"/>
  <circle cx="700" cy="670" r="19" fill="#fffaf0" stroke="#bd7b25" stroke-width="6"/>
  <path d="M700 628V712" stroke="#bd7b25" stroke-width="6" stroke-linecap="round"/>
  <text x="700" y="620" fill="#bd7b25" font-size="20" font-weight="830" text-anchor="middle" letter-spacing="0.8" opacity="1">SCANNER SHIPMENT</text>
  <text x="1010" y="678" fill="#1f272d" font-size="23" font-weight="680" text-anchor="start" letter-spacing="0" opacity="1">leading-edge fab</text>
  <text x="1350" y="678" fill="#bd7b25" font-size="21" font-weight="720" text-anchor="start" letter-spacing="0" opacity="1">Dutch EUV license</text>
</g>
<g>
  <text x="118" y="828" fill="#1f272d" font-size="23" font-weight="680" text-anchor="start" letter-spacing="0" opacity="1">exporter</text>
  <path d="M390 820L930 820" fill="none" stroke="#4f5965" stroke-width="5" marker-end="url(#arrow-ink)"/>
  <circle cx="700" cy="820" r="19" fill="#fffaf0" stroke="#7358a3" stroke-width="6"/>
  <path d="M700 778V862" stroke="#7358a3" stroke-width="6" stroke-linecap="round"/>
  <text x="700" y="770" fill="#7358a3" font-size="20" font-weight="830" text-anchor="middle" letter-spacing="0.8" opacity="1">CHIP IMPORT</text>
  <text x="1010" y="828" fill="#1f272d" font-size="23" font-weight="680" text-anchor="start" letter-spacing="0" opacity="1">US market</text>
  <text x="1350" y="828" fill="#7358a3" font-size="21" font-weight="720" text-anchor="start" letter-spacing="0" opacity="1">Section 232 tariff</text>
</g>
<text x="960" y="970" fill="#1f272d" font-size="29" font-weight="680" text-anchor="middle" letter-spacing="0" opacity="1">Each rule targets a transaction, not the entire supply chain.</text>
</svg>
