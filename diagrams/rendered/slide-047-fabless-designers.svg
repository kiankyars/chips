<text x="104" y="156" fill="#20252b" font-size="48" font-weight="760" text-anchor="start" letter-spacing="0" opacity="1">Fabless is a manufacturing model—not a business model</text>
<path d="M104 190H1816" stroke="#cec6b9" stroke-width="2"/>

