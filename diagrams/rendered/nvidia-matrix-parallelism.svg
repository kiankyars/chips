<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="660" viewBox="0 0 1920 660" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title id="title">One AI layer creates many independent tile jobs</title>
<desc id="desc">One activation block-row and one weight block-column are multiplied and accumulated into one output tile. A full layer repeats that job across an output grid, and a scheduler assigns ready jobs across the streaming-multiprocessor pool.</desc>
