<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <title id="title">China technology gaps</title>
  <desc id="desc">Four rows compare reported domestic progress in EUV, DUV, HBM, and EDA with external reference points.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#102A43" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#667085"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#2563EB"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#C3475D"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#F6F8FB"/>
  <text x="84" y="72" fill="#667085" font-size="18" font-weight="750" text-anchor="start" letter-spacing="2.4" opacity="1">TECHNOLOGY GAP</text>
  <text x="84" y="132" fill="#0B1F3A" font-size="52" font-weight="800" text-anchor="start" letter-spacing="0" opacity="1">China&#x2019;s semiconductor technology gaps are uneven</text>
  <text x="84" y="178" fill="#667085" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">Reported progress differs sharply across lithography, memory, and design software.</text>
  <line x1="84" y1="206" x2="1836" y2="206" stroke="#D9E2EC" stroke-width="2" stroke-linecap="round"/>
  <text x="94" y="252" fill="#667085" font-size="17" font-weight="750" text-anchor="start" letter-spacing="2" opacity="1">TECHNOLOGY</text>
  <text x="450" y="252" fill="#667085" font-size="17" font-weight="750" text-anchor="start" letter-spacing="2" opacity="1">REPORTED DOMESTIC STATE</text>
  <text x="815" y="252" fill="#667085" font-size="15" font-weight="750" text-anchor="start" letter-spacing="1.4" opacity="1">QUALITATIVE GAP · NOT TO SCALE</text>
  <text x="1180" y="252" fill="#667085" font-size="17" font-weight="750" text-anchor="start" letter-spacing="2" opacity="1">EXTERNAL REFERENCE</text>
  <rect x="84" y="282" width="1752" height="140" rx="22" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2"/>
  <rect x="104" y="302" width="250" height="100" rx="18" fill="#FFF5E4" stroke="none" stroke-width="0"/>
  <circle cx="154" cy="352" r="26" fill="#FFFFFF" stroke="#C97A12" stroke-width="4"/>
  <circle cx="154" cy="352" r="8" fill="#C97A12" stroke="none" stroke-width="0"/>
  <text x="200" y="346" fill="#C97A12" font-size="31" font-weight="800" text-anchor="start" letter-spacing="0" opacity="1">EUV</text>
  <text x="200" y="374" fill="#667085" font-size="15" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">reported</text>
  <text x="450" y="344" fill="#1F2937" font-size="24" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">prototype &#xB7; 100&#x2013;150 W</text>
  <text x="450" y="376" fill="#667085" font-size="16" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">reported domestic state</text>
  <line x1="820" y1="354" x2="1090" y2="354" stroke="#C97A12" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.72"/>
  <text x="1180" y="346" fill="#0B1F3A" font-size="23" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">ASML reached about 250 W in 2017</text>
  <text x="1180" y="376" fill="#667085" font-size="16" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">external comparison</text>
  <rect x="84" y="448" width="1752" height="140" rx="22" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2"/>
  <rect x="104" y="468" width="250" height="100" rx="18" fill="#FCECEF" stroke="none" stroke-width="0"/>
  <circle cx="154" cy="518" r="26" fill="#FFFFFF" stroke="#C3475D" stroke-width="4"/>
  <circle cx="154" cy="518" r="8" fill="#C3475D" stroke="none" stroke-width="0"/>
  <text x="200" y="512" fill="#C3475D" font-size="31" font-weight="800" text-anchor="start" letter-spacing="0" opacity="1">DUV</text>
  <text x="200" y="540" fill="#667085" font-size="15" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">reported</text>
  <text x="450" y="510" fill="#1F2937" font-size="24" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">110 nm-resolution KrF dry tool</text>
  <text x="450" y="542" fill="#667085" font-size="16" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">reported domestic state</text>
  <line x1="820" y1="520" x2="1090" y2="520" stroke="#C3475D" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.72"/>
  <text x="1180" y="512" fill="#0B1F3A" font-size="23" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">not a 28 nm immersion scanner</text>
  <text x="1180" y="542" fill="#667085" font-size="16" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">external comparison</text>
  <rect x="84" y="614" width="1752" height="140" rx="22" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2"/>
  <rect x="104" y="634" width="250" height="100" rx="18" fill="#F2EEFB" stroke="none" stroke-width="0"/>
  <circle cx="154" cy="684" r="26" fill="#FFFFFF" stroke="#7552B3" stroke-width="4"/>
  <circle cx="154" cy="684" r="8" fill="#7552B3" stroke="none" stroke-width="0"/>
  <text x="200" y="678" fill="#7552B3" font-size="31" font-weight="800" text-anchor="start" letter-spacing="0" opacity="1">HBM</text>
  <text x="200" y="706" fill="#667085" font-size="15" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">reported</text>
  <text x="450" y="676" fill="#1F2937" font-size="24" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">HBM3 targeted end-2026</text>
  <text x="450" y="708" fill="#667085" font-size="16" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">reported domestic state</text>
  <line x1="820" y1="686" x2="1090" y2="686" stroke="#7552B3" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.72"/>
  <text x="1180" y="678" fill="#0B1F3A" font-size="23" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">about 3&#x2013;4 years behind Korea</text>
  <text x="1180" y="708" fill="#667085" font-size="16" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">external comparison</text>
  <rect x="84" y="780" width="1752" height="140" rx="22" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2"/>
  <rect x="104" y="800" width="250" height="100" rx="18" fill="#EAF2FF" stroke="none" stroke-width="0"/>
  <circle cx="154" cy="850" r="26" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
  <circle cx="154" cy="850" r="8" fill="#2563EB" stroke="none" stroke-width="0"/>
  <text x="200" y="844" fill="#2563EB" font-size="31" font-weight="800" text-anchor="start" letter-spacing="0" opacity="1">EDA</text>
  <text x="200" y="872" fill="#667085" font-size="15" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">reported</text>
  <text x="450" y="842" fill="#1F2937" font-size="24" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">Empyrean &#xB7; ~10&#x2013;12% of China market</text>
  <text x="450" y="874" fill="#667085" font-size="16" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">reported domestic state</text>
  <line x1="820" y1="852" x2="1090" y2="852" stroke="#2563EB" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.72"/>
  <text x="1180" y="844" fill="#0B1F3A" font-size="23" font-weight="650" text-anchor="start" letter-spacing="0" opacity="1">advanced flow still relies on foreign tools</text>
  <text x="1180" y="874" fill="#667085" font-size="16" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">external comparison</text>
  <rect x="510" y="958" width="900" height="70" rx="35" fill="#FCECEF" stroke="#C3475D" stroke-width="2"/>
  <text x="960" y="1003" fill="#C3475D" font-size="25" font-weight="800" text-anchor="middle" letter-spacing="0" opacity="1">No single “years behind” number describes the stack</text>
</svg>
