<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <title id="title">US industrial fab investments</title>
  <desc id="desc">A simplified US map and summary metrics show federal support, announced company investments, and projected advanced-logic capacity growth.</desc>
  <defs>
