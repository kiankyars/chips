<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <title id="title">Export control expansion</title>
  <desc id="desc">A timeline shows US semiconductor controls expanding from Huawei in 2019 to broad technology and supply categories in 2024.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#102A43" flood-opacity="0.09"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#667085"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#2563EB"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#C3475D"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#F6F8FB"/>
  <text x="84" y="72" fill="#667085" font-size="18" font-weight="750" text-anchor="start" letter-spacing="2.4" opacity="1">CONTROL SCOPE · NOT TO SCALE</text>
  <text x="84" y="132" fill="#0B1F3A" font-size="52" font-weight="800" text-anchor="start" letter-spacing="0" opacity="1">U.S. export controls expanded from firms to capabilities</text>
  <text x="84" y="178" fill="#667085" font-size="24" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">Each rule widened the reach&#x2014;from one named company to technologies and supply categories.</text>
  <line x1="84" y1="206" x2="1836" y2="206" stroke="#D9E2EC" stroke-width="2" stroke-linecap="round"/>
  <text x="240" y="282" fill="#667085" font-size="17" font-weight="750" text-anchor="middle" letter-spacing="2" opacity="1">ONE COMPANY + AFFILIATES</text>
  <text x="1640" y="282" fill="#C3475D" font-size="17" font-weight="800" text-anchor="middle" letter-spacing="2" opacity="1">COUNTRY-WIDE CAPABILITY</text>
  <path d="M310 312 C700 200 1250 200 1540 300" fill="none" stroke="#C3475D" stroke-width="3" opacity="0.65" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRed)" stroke-dasharray="11 10"/>
  <line x1="170" y1="565" x2="1765" y2="565" stroke="#C3475D" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowRed)"/>
  <circle cx="260" cy="565" r="78" fill="#FFFFFF" stroke="#C3475D" stroke-width="5"/>
  <circle cx="260" cy="565" r="10" fill="#C3475D" stroke="none" stroke-width="0"/>
  <text x="260" y="715" fill="#C3475D" font-size="25" font-weight="800" text-anchor="middle" letter-spacing="0" opacity="1">MAY 2019</text>
  <text x="260" y="751" fill="#667085" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">Huawei &#xB7; Entity List</text>
  <circle cx="685" cy="565" r="115" fill="#FFFFFF" stroke="#C3475D" stroke-width="5"/>
  <circle cx="685" cy="565" r="14" fill="#C3475D" stroke="none" stroke-width="0"/>
  <text x="685" y="752" fill="#C3475D" font-size="25" font-weight="800" text-anchor="middle" letter-spacing="0" opacity="1">MAY 2020</text>
  <text x="685" y="788" fill="#667085" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">FDPR reaches foreign fabs</text>
  <circle cx="1120" cy="565" r="156" fill="#FFFFFF" stroke="#C3475D" stroke-width="5"/>
  <circle cx="1120" cy="565" r="19" fill="#C3475D" stroke="none" stroke-width="0"/>
  <text x="1120" y="793" fill="#C3475D" font-size="25" font-weight="800" text-anchor="middle" letter-spacing="0" opacity="1">OCT 2022</text>
  <text x="1120" y="829" fill="#667085" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">advanced chips + fab tools</text>
  <circle cx="1570" cy="565" r="205" fill="#FFFFFF" stroke="#C3475D" stroke-width="5"/>
  <circle cx="1570" cy="565" r="25" fill="#C3475D" stroke="none" stroke-width="0"/>
  <text x="1570" y="842" fill="#C3475D" font-size="25" font-weight="800" text-anchor="middle" letter-spacing="0" opacity="1">DEC 2024</text>
  <text x="1570" y="878" fill="#667085" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="0" opacity="1">HBM &#xB7; 140 entities &#xB7; 27 categories</text>
  <text x="260" y="526" fill="#C3475D" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1.6" opacity="1">FIRM</text>
  <text x="685" y="526" fill="#C3475D" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1.6" opacity="1">FDPR / FABS</text>
  <text x="1120" y="510" fill="#C3475D" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1.4" opacity="1">CHIPS +</text>
  <text x="1120" y="533" fill="#C3475D" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1.4" opacity="1">TOOLS</text>
  <text x="1570" y="500" fill="#C3475D" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1.2" opacity="1">TECHNOLOGIES +</text>
  <text x="1570" y="523" fill="#C3475D" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="1.2" opacity="1">CATEGORIES</text>
</svg>
